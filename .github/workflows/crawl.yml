name: crawl

on:
  schedule:
    # Every 30 min at off-peak minutes. GitHub heavily throttles schedules on
    # the hour: a "0 */2 * * *" cron actually delivered a 6.4h mean / 14.1h max
    # gap (Aug 2026). Odd minutes queue far less, and this repo is public so
    # Actions minutes are free.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed silently (record postings, send NO alerts)"
        type: boolean
        default: false

# Needed so the job can commit updated data back to the repo.
permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run crawler
        env:
          DISCORD_WEBHOOK_QUANT: ${{ secrets.DISCORD_WEBHOOK_QUANT }}
          DISCORD_WEBHOOK_FAANG: ${{ secrets.DISCORD_WEBHOOK_FAANG }}
          DISCORD_WEBHOOK_OTHER: ${{ secrets.DISCORD_WEBHOOK_OTHER }}
          DISCORD_WEBHOOK_QUANT_KIG: ${{ secrets.DISCORD_WEBHOOK_QUANT_KIG }}
          DISCORD_WEBHOOK_FAANG_KIG: ${{ secrets.DISCORD_WEBHOOK_FAANG_KIG }}
          DISCORD_WEBHOOK_OTHER_KIG: ${{ secrets.DISCORD_WEBHOOK_OTHER_KIG }}
          DISCORD_WEBHOOK_QUANT_NG_KIG: ${{ secrets.DISCORD_WEBHOOK_QUANT_NG_KIG }}
          DISCORD_WEBHOOK_FAANG_NG_KIG: ${{ secrets.DISCORD_WEBHOOK_FAANG_NG_KIG }}
          DISCORD_WEBHOOK_OTHER_NG_KIG: ${{ secrets.DISCORD_WEBHOOK_OTHER_NG_KIG }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
        run: |
          python src/main.py ${{ (github.event_name == 'workflow_dispatch' && inputs.seed) && '--seed' || '' }}

      - name: Commit updated postings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."; exit 0
          fi
          git commit -m "chore: update postings ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push attempt $i failed (non-fast-forward?); retrying..."; sleep 3
          done
          echo "push failed after retries"; exit 1
