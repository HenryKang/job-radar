name: crawl

on:
  schedule:
    # Every 2 hours -> worst-case detection latency ~2h (well inside the 12h SLA).
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed silently (record postings, send NO alerts)"
        type: boolean
        default: false

# Needed so the job can commit updated data back to the repo.
permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run crawler
        env:
          DISCORD_WEBHOOK_QUANT: ${{ secrets.DISCORD_WEBHOOK_QUANT }}
          DISCORD_WEBHOOK_FAANG: ${{ secrets.DISCORD_WEBHOOK_FAANG }}
          DISCORD_WEBHOOK_OTHER: ${{ secrets.DISCORD_WEBHOOK_OTHER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
        run: |
          python src/main.py ${{ (github.event_name == 'workflow_dispatch' && inputs.seed) && '--seed' || '' }}

      - name: Commit updated postings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update postings ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
