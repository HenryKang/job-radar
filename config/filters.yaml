# Filtering rules. Tune these freely — they decide what counts as a relevant
# posting and therefore what triggers a Discord alert.
#
# Design bias: it is far worse to MISS a real posting than to get an extra
# alert, so location/season checks are lenient (unknown => keep).

# Which seasons to keep (matches the aggregator `season` field).
seasons:
  - Summer
include_off_season: false   # set true to also keep Fall/Winter/Spring

# For raw ATS results (which return ALL jobs), the title must contain one of
# these to be considered an internship. Aggregators are already intern-only,
# so this is only enforced on ATS sources.
title_include_any:
  - intern
  - internship
  - co-op
  - coop

# New grad: title must contain one of these (ATS sources only).
# Aggregator (vanshb03-newgrad2027) is already new-grad scoped.
new_grad_title_include_any:
  - new grad
  - new-grad
  - university grad
  - entry level
  - entry-level
  - associate software
  - associate engineer
  - junior engineer
  - junior software
  - software engineer i
  - software engineer 1
  - swe i
  - swe 1

# New grad: drop senior/staff/lead roles.
new_grad_title_exclude_any:
  - senior
  - staff
  - principal
  - director
  - manager
  - lead
  - phd

# Drop anything whose title contains these (senior / non-student roles).
title_exclude_any:
  - senior
  - staff
  - principal
  - director
  - manager
  - phd

# A posting is kept only if its title matches one of these categories.
# The matched category is stored on the posting.
category_keywords:
  swe:
    - software
    - swe
    - engineer          # also matches "engineering"
    - developer
    - programming
    - technology
  quant:
    - quant             # also matches "quantitative"
    - trading
    - trader
    - researcher
  ml_data:
    - machine learning
    - deep learning
    - artificial intelligence
    - data scien        # data science / data scientist
    - data engineer

# For ATS postings (no season field): drop if the title clearly names an old
# cycle year and does NOT mention 2027.
target_year: "2027"
stale_years:
  - "2024"
  - "2025"
  - "2026"

# Eligibility / liveness pre-check: fetch each NEW posting's page and drop dead
# links + roles that don't fit an undergraduate junior (PhD-only, master's-only,
# underclassmen-only). "unknown" (unfetchable / no clear signal) is KEPT.
eligibility:
  enabled: true
  keep_unknown: true    # keep postings we can't positively classify (don't-miss)
  max_checks: 150       # cap page fetches per run (protects CI runtime)
  timeout: 15           # per-request seconds

locations:
  us_only: true
  allow_remote: true          # keep "Remote" postings (unless they name a non-US place)
  # When a location has NO US and NO known non-US signal (e.g. "Hybrid"), keep it?
  # false = strict US-only (drop the unknown). Flip to true if you start MISSING
  # real US roles whose location text we don't recognize.
  keep_unknown_location: false

  # --- Positive US signals (matched as whole words, case-insensitive) ---
  us_words:
    - United States
    - USA
    - U.S.A
    - U.S.
    - U.S
    - US
  us_state_abbr:                # matched as ", NY" or as a bare token "NJ"
    [AL, AK, AZ, AR, CA, CO, CT, DE, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA,
     ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK,
     OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY, DC]
